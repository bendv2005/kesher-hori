<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="הודלי איילון - הדרכת הורים. האתר בשיפוצים ויתעדכן בקרוב.">
  <title>הודלי איילון | בקרוב...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #4FB5A8;
      --color-secondary: #3A3A3A;
      --color-accent: #A4D4CD;
      --color-background: #FFFFFF;
      --color-text: #2E2E2E;
      --color-light-gray: #f9f9f9;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Heebo', sans-serif;
      background-color: var(--color-light-gray);
      color: var(--color-text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      direction: rtl;
    }

    .container {
      background: var(--color-background);
      padding: 3rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      color: var(--color-primary);
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: var(--color-secondary);
    }

    .contact-info {
      border-top: 1px solid var(--color-accent);
      padding-top: 2rem;
    }

    .contact-info a {
      display: inline-block;
      margin: 0.5rem 1rem;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .contact-info a:hover {
      opacity: 0.7;
    }

    .logo-placeholder {
      width: 80px;
      height: 80px;
      background-color: var(--color-primary);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-placeholder">הא</div>
    <h1>הודלי איילון</h1>
    <p>האתר עובר שדרוג ויתעדכן בקרוב מאוד...</p>
    
    <div class="contact-info">
      <h3>בינתיים מוזמנים ליצור קשר:</h3>
      <a href="mailto:ayalonhodeli@gmail.com">דוא"ל</a>
      <a href="https://wa.me/972586510056" target="_blank" rel="noopener noreferrer">ווטסאפ</a>
    </div>
  </div>
</body>
</html>
